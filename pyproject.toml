[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutang-telegram-bridge"
version = "0.6.0"
description = "A durable, security-oriented Telegram bridge for multiple local AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SuTangSharing contributors"}]
dependencies = []

[project.scripts]
sutang-telegram-bridge = "sutang_telegram_bridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]
